    var f=14+Math.random()*10,g=x.createLinearGradient(-30,0,-30-f*3,0);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g;x.beginPath();x.moveTo(-30,-5);x.lineTo(-30-f*3,0);x.lineTo(-30,5);x.fill();
    x.fillStyle='#fff';x.beginPath();x.moveTo(40,0);x.lineTo(8,-9);x.lineTo(-24,-18);x.lineTo(-18,-5);x.lineTo(-30,-5);x.lineTo(-30,5);x.lineTo(-18,5);x.lineTo(-24,18);x.lineTo(8,9);x.closePath();x.fill();
    x.fillStyle='#000';x.beginPath();x.ellipse(10,0,8,3,0,0,7);x.fill();x.restore()}
  function frame(){t++;x.fillStyle='#000';x.fillRect(0,0,W,H);var sp=[.25,.7,1.6];
    stars.forEach(function(s){if(!still)s.x-=sp[s.l]*2.2;if(s.x<0){s.x=W;s.y=R(0,H)}
      var a=.35+.35*Math.sin(t/30+s.p);x.fillStyle='rgba(255,255,255,'+(s.l===0?a*.6:a)+')';
      if(s.l===2)x.fillRect(s.x,s.y,5,1);else x.fillRect(s.x,s.y,s.l+1,s.l+1)});
    planets.forEach(function(p,i){if(!still)p.x-=p.s*2.2;if(p.x<-p.r*3)planets[i]=mk(false);planet(p)});
    ship(W*.5+Math.sin(t/90)*30,H*.45+Math.sin(t/55)*14);
    if(!still)requestAnimationFrame(frame)}
  init();frame();addEventListener('resize',function(){init();if(still)frame()});
})();
</script>
